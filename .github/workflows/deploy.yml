name: Deploy to Cloudflare Pages

# 只要 main 分支有新提交（包括工作台保存笔记），就自动构建并上线。
on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 GitHub 网页上手动点一下运行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zhiyenotes --branch=main
